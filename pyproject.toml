[project]
name = "forest-signal"
version = "1.0.0"
description = "Raster-backed forest biomass change analysis portfolio project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "numpy>=2,<3", "rasterio>=1.4,<2", "shapely>=2,<3", "pyproj>=3.6,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]
